# Pandoc defaults file for the IngesCompany project report.
# Usage (from the repository root): pandoc --defaults=pandoc/report.yaml

# GitHub-flavored Markdown, so the PDF matches the preview in GitHub and WebStorm.
from: gfm
to: html5
standalone: true
embed-resources: true
pdf-engine: weasyprint
css:
  - pandoc/report.css

# Docs-as-Code order: front matter (01-09), chapters (10-89), bibliography
# (99) and annexes.
input-files:
  - report/front-matter/01-cover.md
  - report/front-matter/02-version-history.md
  - report/front-matter/03-collaboration-insights.md
  - report/front-matter/04-student-outcome.md
  - report/11-introduction.md
  - report/12-requirements-elicitation-and-analysis.md
  - report/13-requirements-specification.md
  - report/14-product-design.md
  - report/15-product-implementation-validation-and-deployment.md
  - report/16-conclusions.md
  - report/99-bibliography.md
  - report/annexes/annex-a-exposition-videos.md

output-file: build/upc-pre-202620-1asi0729-7742-IngesCompany-report.pdf

# The chapters use assets/..., the front matter and the annexes ../assets/...
resource-path:
  - report
  - report/front-matter
  - report/annexes

# Marks the cover and inserts the table of contents.
filters:
  - pandoc/report.lua

metadata:
  title: Informe del Trabajo Final - DoofPlus
  lang: es-PE
